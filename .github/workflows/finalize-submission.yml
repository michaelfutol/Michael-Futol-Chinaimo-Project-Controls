name: Finalize Submission Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-submission.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize reviewer download panels
        shell: python
        run: |
          from pathlib import Path

          en = Path('app/page.tsx')
          s = en.read_text(encoding='utf-8')
          s = s.replace(
              '<a className="secondaryBtn" href="/downloads/Michael_Futol_Chinaimo_Technical_Assessment.pdf" download>Printable PDF Pack</a>',
              '<a className="secondaryBtn" href="/downloads/CHINAIMO_PROJECT_CONTROLS_QA_FINAL_REVIEWED_EN.docx" download>Reviewer Q&A (.docx)</a>'
          )
          old = '<div className="downloadGrid"><a href="/downloads/Michael_Futol_Chinaimo_Project_Controls.xlsx" download><b>Excel Project Controls Workbook</b><span>.xlsx · BOQ · Measurement · Progress · Gantt · S-Curve · Claim · Delay Analysis</span><em>DOWNLOAD ↓</em></a><a href="/downloads/Michael_Futol_Chinaimo_Technical_Assessment.pdf" download><b>Printable Assessment Pack</b><span>PDF · executive status · BOQ/progress · native schedule evidence · delay commentary · source register</span><em>DOWNLOAD PDF ↓</em></a><a href="/downloads/Michael_Futol_Chinaimo_MSProject_Package.zip" download><b>Complete Microsoft Project Package</b><span>ZIP · baseline + critical-delay + non-critical + concurrent-delay + procurement-watch .mpp files. Extract into the same folder as the Excel workbook.</span><em>DOWNLOAD ZIP ↓</em></a><a href="https://github.com/michaelfutol/Michael-Futol-Chinaimo-Project-Controls" target="_blank"><b>GitHub Audit Trail</b><span>Source data · Schedule data · Governance · Web source · Revision history</span><em>INSPECT ↗</em></a></div>'
          new = '<div className="downloadGrid"><a href="/downloads/Michael_Futol_Chinaimo_Project_Controls.xlsx" download><b>Excel Project Controls Workbook</b><span>.xlsx · BOQ · Measurement · Progress · Gantt · S-Curve · Claim · Delay Analysis</span><em>DOWNLOAD ↓</em></a><a href="/downloads/CHINAIMO_PROJECT_CONTROLS_QA_FINAL_REVIEWED_EN.docx" download><b>Reviewer Q&A — English</b><span>.docx · Schedule · Delay · Recovery · Reviewer defence notes</span><em>DOWNLOAD DOCX ↓</em></a><a href="/downloads/CHINAIMO_PROJECT_CONTROLS_QA_JAPANESE_REVIEWER_COMPANION.docx" download><b>Reviewer Q&A — 日本語</b><span>.docx · Japanese reviewer-convenience companion; English/native records remain technical authority</span><em>DOWNLOAD DOCX ↓</em></a><a href="/downloads/Michael_Futol_Chinaimo_MSProject_Package.zip" download><b>Complete Microsoft Project Package</b><span>ZIP · Baseline + Scenarios A/B/C/D + Recovery Programme · native .mpp files</span><em>DOWNLOAD ZIP ↓</em></a><a href="https://github.com/michaelfutol/Michael-Futol-Chinaimo-Project-Controls" target="_blank"><b>GitHub Audit Trail</b><span>Source data · Schedule data · Governance · Web source · Revision history</span><em>INSPECT ↗</em></a></div>'
          if old not in s:
              raise SystemExit('English download grid signature not found')
          en.write_text(s.replace(old,new), encoding='utf-8')

          ja = Path('app/ja/page.tsx')
          s = ja.read_text(encoding='utf-8')
          s = s.replace(
              '<a className="secondaryBtn" href="/downloads/Michael_Futol_Chinaimo_Technical_Assessment.pdf" download>印刷用PDF Pack</a>',
              '<a className="secondaryBtn" href="/downloads/CHINAIMO_PROJECT_CONTROLS_QA_JAPANESE_REVIEWER_COMPANION.docx" download>レビュアーQ&A (.docx)</a>'
          )
          old = '<div className="downloadGrid"><a href="/downloads/Michael_Futol_Chinaimo_Project_Controls.xlsx" download><b>Excel Project Controls Workbook</b><span>.xlsx · BOQ · Measurement · Progress · Gantt · S-Curve · Claim · Delay Analysis</span><em>DOWNLOAD ↓</em></a><a href="/downloads/Michael_Futol_Chinaimo_Technical_Assessment.pdf" download><b>Printable Assessment Pack</b><span>PDF · status · BOQ/progress · schedule evidence · delay commentary · sources</span><em>DOWNLOAD PDF ↓</em></a><a href="/downloads/Michael_Futol_Chinaimo_MSProject_Package.zip" download><b>Complete Microsoft Project Package</b><span>Baseline / delay scenarios / recovery evidenceを含むネイティブMPPパッケージ。</span><em>DOWNLOAD ZIP ↓</em></a><a href="https://github.com/michaelfutol/Michael-Futol-Chinaimo-Project-Controls" target="_blank"><b>GitHub Audit Trail</b><span>Source data · Schedule data · Governance · Revision history</span><em>INSPECT ↗</em></a></div>'
          new = '<div className="downloadGrid"><a href="/downloads/Michael_Futol_Chinaimo_Project_Controls.xlsx" download><b>Excel Project Controls Workbook</b><span>.xlsx · BOQ · Measurement · Progress · Gantt · S-Curve · Claim · Delay Analysis</span><em>DOWNLOAD ↓</em></a><a href="/downloads/CHINAIMO_PROJECT_CONTROLS_QA_JAPANESE_REVIEWER_COMPANION.docx" download><b>レビュアーQ&A — 日本語</b><span>.docx · 工程 · 遅延 · Recovery · レビュー用コンパニオン</span><em>DOWNLOAD DOCX ↓</em></a><a href="/downloads/CHINAIMO_PROJECT_CONTROLS_QA_FINAL_REVIEWED_EN.docx" download><b>Reviewer Q&A — English</b><span>.docx · 技術上の英語正本</span><em>DOWNLOAD DOCX ↓</em></a><a href="/downloads/Michael_Futol_Chinaimo_MSProject_Package.zip" download><b>Complete Microsoft Project Package</b><span>Baseline + Scenario A/B/C/D + Recovery Programme を含むネイティブMPPパッケージ。</span><em>DOWNLOAD ZIP ↓</em></a><a href="https://github.com/michaelfutol/Michael-Futol-Chinaimo-Project-Controls" target="_blank"><b>GitHub Audit Trail</b><span>Source data · Schedule data · Governance · Revision history</span><em>INSPECT ↗</em></a></div>'
          if old not in s:
              raise SystemExit('Japanese download grid signature not found')
          ja.write_text(s.replace(old,new), encoding='utf-8')

      - name: Export certified Microsoft Project models
        uses: actions/upload-artifact@v4
        with:
          name: Chinaimo_MSProject_Certified
          path: |
            public/downloads/Michael_Futol_Chinaimo_Baseline.mpp
            public/downloads/Michael_Futol_Chinaimo_Scenario_A_Critical_Delay.mpp
            public/downloads/Michael_Futol_Chinaimo_Scenario_B_NonCritical_Delay.mpp
            public/downloads/Michael_Futol_Chinaimo_Scenario_C_Concurrent_Delays.mpp
            public/downloads/Michael_Futol_Chinaimo_Scenario_D_Procurement_Watch.mpp
            public/downloads/Michael_Futol_Chinaimo_Recovery_Programme.mpp
            public/downloads/Michael_Futol_Chinaimo_MSProject_Package.zip
          if-no-files-found: error
          retention-days: 7

      - name: Commit final website wiring
        shell: bash
        run: |
          rm -f _assistant_probe_unused.txt
          rm -f .github/workflows/finalize-submission.yml
          git config user.name "FutolTech Submission QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "site: finalize reviewer downloads and submission links"
          git push
