name: Publish final Office binaries

on:
  push:
    paths:
      - '.binary-staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact submission files
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib

          jobs = [
              (
                  '.binary-staging/excel',
                  'public/downloads/Michael_Futol_Chinaimo_Project_Controls.xlsx',
                  'c7b383f608509205d1773bbf66052e054407f0a6648220437a9691020260b38e',
                  41012,
              ),
              (
                  '.binary-staging/en',
                  'public/downloads/CHINAIMO_PROJECT_CONTROLS_QA_FINAL_REVIEWED_EN.docx',
                  '02967610b290bf583886151066eb8b98ec6a5a8e4fe9269d1fef1b1e94a52530',
                  18789,
              ),
              (
                  '.binary-staging/jp',
                  'public/downloads/CHINAIMO_PROJECT_CONTROLS_QA_JAPANESE_REVIEWER_COMPANION.docx',
                  '4b987ffd9df186a9b97fe3eb3a6b50e407094ade1ba5439e05196fa70ac59eb9',
                  20021,
              ),
          ]

          for prefix, target, expected_sha, expected_size in jobs:
              parts = sorted(Path('.binary-staging').glob(Path(prefix).name + '.part*.b64'))
              if not parts:
                  raise SystemExit(f'No chunks found for {prefix}')
              payload = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
              data = base64.b64decode(payload, validate=True)
              actual_sha = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size or actual_sha != expected_sha:
                  raise SystemExit(
                      f'Integrity failure for {target}: size={len(data)}, sha256={actual_sha}'
                  )
              out = Path(target)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              print(f'OK {target}: {len(data)} bytes sha256={actual_sha}')

      - name: Commit verified binaries
        shell: bash
        run: |
          git config user.name "FutolTech Submission QA"
          git config user.email "actions@users.noreply.github.com"
          git add public/downloads/Michael_Futol_Chinaimo_Project_Controls.xlsx \
                  public/downloads/CHINAIMO_PROJECT_CONTROLS_QA_FINAL_REVIEWED_EN.docx \
                  public/downloads/CHINAIMO_PROJECT_CONTROLS_QA_JAPANESE_REVIEWER_COMPANION.docx
          if git diff --cached --quiet; then
            echo "Verified binaries already match; nothing to commit."
          else
            git commit -m "deliverables: publish verified final Excel and bilingual FAQ binaries"
            git push
          fi
