name: Publish Final Office Binaries

on:
  push:
    branches: [main]
    paths:
      - '.binary-staging/final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify lean final Office files
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib

          specs = {
            'excel': ('Michael_Futol_Chinaimo_Project_Controls.xlsx', 41404, '8b8cc4516afea1c0878e37d3a7d3fc081580dafbdd8d758aee9b40220acf9b84'),
            'en': ('CHINAIMO_PROJECT_CONTROLS_QA_FINAL_REVIEWED_EN.docx', 41673, '7d940180e8f8a6b5d2b14ad33caae1281a053b57698d6708b680faa8431739dd'),
            'jp': ('CHINAIMO_PROJECT_CONTROLS_QA_JAPANESE_REVIEWER_COMPANION.docx', 42367, '9ee89bcf9a716d2dcc3d7d67fbe4cc18a659dba3c4a4de4671ab4573384f2ffb'),
          }
          src = Path('.binary-staging/final')
          out = Path('public/downloads')
          out.mkdir(parents=True, exist_ok=True)
          for key, (name, expected_size, expected_sha) in specs.items():
              parts = sorted(src.glob(f'{key}.leanpart*'))
              if not parts:
                  raise SystemExit(f'No lean staged parts for {key}')
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
              data = base64.b64decode(encoded, validate=True)
              actual_sha = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size:
                  raise SystemExit(f'{name}: size {len(data)} != {expected_size}')
              if actual_sha != expected_sha:
                  raise SystemExit(f'{name}: sha256 {actual_sha} != {expected_sha}')
              (out / name).write_bytes(data)
              print(f'VERIFIED {name}: {len(data)} bytes sha256={actual_sha}')

      - name: Commit exact binaries and clean staging
        shell: bash
        run: |
          rm -rf .binary-staging/final
          rm -f .github/workflows/publish-final-office.yml
          git config user.name "FutolTech Submission QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "deliverables: publish lean final Excel and bilingual reviewer Word files"
          git push
