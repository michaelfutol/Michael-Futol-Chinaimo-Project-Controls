name: Fix source text encoding

on:
  push:
    paths:
      - '.github/workflows/fix-text-encoding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair known mojibake sequences
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'mÂ³': 'm³',
              'mÂ²': 'm²',
              'â€”': '—',
              'â€“': '–',
              'â†’': '→',
              'â†“': '↓',
              'â†—': '↗',
              'â‰¤': '≤',
              'â‰¥': '≥',
              'Â¥': '¥',
              'â€¦': '…',
              'â€œ': '“',
              'â€': '”',
              'â€˜': '‘',
              'â€™': '’',
          }

          roots = [Path('data'), Path('app')]
          files = [Path('README.md')]
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.suffix.lower() in {'.json','.ts','.tsx','.md','.css'})

          changed = []
          for path in files:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8-sig')
              original = text
              for bad, good in replacements.items():
                  text = text.replace(bad, good)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(' -', path)

          leftovers = []
          for path in files:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'Â' in text or 'â€' in text or 'â†' in text or 'â‰' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Unresolved mojibake remains in: ' + ', '.join(leftovers))

      - name: Commit repaired text
        run: |
          if git diff --quiet; then
            echo "No encoding changes required."
            exit 0
          fi
          git config user.name "FutolTech QA"
          git config user.email "actions@users.noreply.github.com"
          git add data app README.md
          git commit -m "fix: normalize reviewer-facing UTF-8 text"
          git push
