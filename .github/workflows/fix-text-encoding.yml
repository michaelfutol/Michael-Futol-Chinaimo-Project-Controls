name: Fix source text encoding

on:
  push:
    paths:
      - '.github/workflows/fix-text-encoding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair known mojibake sequences
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'm\u00c2\u00b3': 'm\u00b3',
              'm\u00c2\u00b2': 'm\u00b2',
              '\u00e2\u20ac\u201d': '\u2014',
              '\u00e2\u20ac\u201c': '\u2013',
              '\u00c2\u00a5': '\u00a5',
          }

          files = [Path('README.md')]
          for root in (Path('data'), Path('app')):
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.suffix.lower() in {'.json', '.ts', '.tsx', '.md', '.css'})

          changed = []
          for path in files:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8-sig')
              original = text
              for bad, good in replacements.items():
                  text = text.replace(bad, good)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', changed)

          leftovers = []
          for path in files:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              if '\u00c2\u00b3' in text or '\u00c2\u00b2' in text or '\u00e2\u20ac\u201d' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Known mojibake remains in: ' + ', '.join(leftovers))
          PY

      - name: Commit repaired text
        run: |
          if git diff --quiet; then
            echo "No encoding changes required."
            exit 0
          fi
          git config user.name "FutolTech QA"
          git config user.email "actions@users.noreply.github.com"
          git add data app README.md
          git commit -m "fix: normalize reviewer-facing UTF-8 text"
          git push
