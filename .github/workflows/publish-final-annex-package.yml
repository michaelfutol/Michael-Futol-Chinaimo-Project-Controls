name: Publish Final Annex Package

on:
  push:
    branches:
      - main
    paths:
      - .binary-staging/annex/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified annex and ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, binascii, hashlib, zipfile

          EXPECTED_SIZE = 19554
          EXPECTED_SHA = 'c7ee8583e9a5eea50b8af5e8aa540f79a399691a696fc467f282b69823786d28'
          root = Path('public/downloads')
          root.mkdir(parents=True, exist_ok=True)
          stage = Path('.binary-staging/annex')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in sorted(stage.glob('annex.part*')))

          def verified_decode(s):
              try:
                  data = base64.b64decode(s, validate=True)
              except binascii.Error:
                  return None
              if len(data) == EXPECTED_SIZE and hashlib.sha256(data).hexdigest() == EXPECTED_SHA:
                  return data
              return None

          data = verified_decode(encoded)
          if data is None and len(encoded) == 26073:
              # One staging character was introduced in transit. Remove one character at a time;
              # accept ONLY the candidate matching the exact original size and SHA-256.
              for i in range(len(encoded)):
                  data = verified_decode(encoded[:i] + encoded[i+1:])
                  if data is not None:
                      print(f'Self-healed one staging character at index {i}')
                      break
          if data is None:
              raise SystemExit('Unable to reconstruct exact verified annex bytes')

          annex = root / 'Michael_Futol_Chinaimo_Schedule_Logic_Progress_SCurve_ANNEX_FINAL_2026-08-31.xlsx'
          annex.write_bytes(data)

          entries = [
            ('01_Core_Documents/Michael_Futol_Chinaimo_Project_Controls_FINAL_BEAUTIFIED_NATIVE_CPM_2026-08-31.xlsx', root / 'Michael_Futol_Chinaimo_Project_Controls_FINAL_BEAUTIFIED_NATIVE_CPM_2026-08-31.xlsx'),
            ('01_Core_Documents/CHINAIMO_PROJECT_CONTROLS_REVIEWER_COMPANION_EN_FINAL_NATIVE_CPM_2026-08-31.docx', root / 'CHINAIMO_PROJECT_CONTROLS_REVIEWER_COMPANION_EN_FINAL_NATIVE_CPM_2026-08-31.docx'),
            ('01_Core_Documents/Michael_Futol_Chinaimo_Schedule_Logic_Progress_SCurve_ANNEX_FINAL_2026-08-31.xlsx', annex),
            ('02_Native_MS_Project/Michael_Futol_Chinaimo_Baseline.mpp', root / 'Michael_Futol_Chinaimo_Baseline.mpp'),
            ('02_Native_MS_Project/Michael_Futol_Chinaimo_Actual_Progress.mpp', root / 'Michael_Futol_Chinaimo_Actual_Progress.mpp'),
            ('02_Native_MS_Project/Michael_Futol_Chinaimo_Recovery.mpp', root / 'Michael_Futol_Chinaimo_Recovery.mpp'),
            ('03_A2_Printouts/Michael_Futol_Chinaimo_Baseline_Gantt_A2.pdf', root / 'printouts/Michael_Futol_Chinaimo_Baseline_Gantt_A2.pdf'),
            ('03_A2_Printouts/Michael_Futol_Chinaimo_Actual_Tracking_Gantt_A2.pdf', root / 'printouts/Michael_Futol_Chinaimo_Actual_Tracking_Gantt_A2.pdf'),
            ('03_A2_Printouts/Michael_Futol_Chinaimo_Actual_Critical_Path_A2.pdf', root / 'printouts/Michael_Futol_Chinaimo_Actual_Critical_Path_A2.pdf'),
            ('03_A2_Printouts/Michael_Futol_Chinaimo_Recovery_Tracking_Gantt_A2.pdf', root / 'printouts/Michael_Futol_Chinaimo_Recovery_Tracking_Gantt_A2.pdf'),
            ('03_A2_Printouts/Michael_Futol_Chinaimo_Recovery_Critical_Path_A2.pdf', root / 'printouts/Michael_Futol_Chinaimo_Recovery_Critical_Path_A2.pdf'),
          ]
          for arc, src in entries:
              assert src.is_file() and src.stat().st_size > 0, str(src)

          readme = (
            'MICHAEL FUTOL - CHINAIMO PROJECT CONTROLS TECHNICAL ASSESSMENT\n'
            'Website: https://michael-futol-chinaimo-project-cont.vercel.app/\n\n'
            'Assessment Data Date: 31-Aug-2026\n'
            'Native CPM: Baseline 15-Feb-2028 | Current Forecast 23-Jun-2028 (+111 wd) | Partial Recovery 14-Apr-2028 (60 wd recovered; 51 wd residual)\n'
            'Public July-2028 completion target is a separate public reference.\n'
            'Public progress checkpoint: 4.19% at 05-May-2026.\n'
            '12.095% at 31-Aug-2026 is assessment-simulated and is not represented as Kubota actual progress.\n\n'
            'Authority:\n'
            '- Native MPPs govern schedule logic / CPM dates.\n'
            '- Final Master Excel governs assessment BOQ/value/progress/recovery/IPC control.\n'
            '- Schedule Logic & S-Curve Annex supports predecessor logic and comparative curves.\n'
            '- English Word is reviewer explanatory support.\n'
          )

          package = root / 'Michael_Futol_Chinaimo_Project_Controls_FINAL_SUBMISSION_2026-08-31.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('README_SUBMISSION.txt', readme)
              for arc, src in entries:
                  z.write(src, arc)
          with zipfile.ZipFile(package, 'r') as z:
              assert z.testzip() is None
              assert len(z.namelist()) == 12
          print('ANNEX', annex.stat().st_size, hashlib.sha256(annex.read_bytes()).hexdigest())
          print('ZIP', package.stat().st_size, hashlib.sha256(package.read_bytes()).hexdigest())
          PY

      - name: Publish files
        shell: bash
        run: |
          rm -rf .binary-staging/annex
          rm -f .github/workflows/publish-final-annex-package.yml
          git config user.name "FutolTech Submission QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "deliverables: publish final annex and submission ZIP"
          git push
