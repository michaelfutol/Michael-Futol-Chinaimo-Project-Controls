name: Publish Web Final Office Files

on:
  push:
    branches: [main]
    paths:
      - '.binary-staging/web-final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify final Office files
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib

          specs = {
            'companion': (
              'CHINAIMO_PROJECT_CONTROLS_REVIEWER_COMPANION_EN_FINAL_NATIVE_CPM_2026-08-31.docx',
              33174,
              '4e86845c92a10b4a795440aa8d85cbb8f18a4554e723eb158d4a1c327027403b'
            ),
            'beauty': (
              'Michael_Futol_Chinaimo_Project_Controls_FINAL_BEAUTIFIED_NATIVE_CPM_2026-08-31.xlsx',
              19356,
              'eb58fdbad890b3177243b7c2ebbef650f37f4385869cae35fbc127282f3e2121'
            ),
          }
          src = Path('.binary-staging/web-final')
          out = Path('public/downloads')
          out.mkdir(parents=True, exist_ok=True)

          for key, (name, expected_size, expected_sha) in specs.items():
              parts = sorted(src.glob(f'{key}.part*'))
              if not parts:
                  raise SystemExit(f'No staged parts for {key}')
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
              data = base64.b64decode(encoded, validate=True)
              actual_sha = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size:
                  raise SystemExit(f'{name}: size {len(data)} != {expected_size}')
              if actual_sha != expected_sha:
                  raise SystemExit(f'{name}: sha256 {actual_sha} != {expected_sha}')
              (out / name).write_bytes(data)
              print(f'VERIFIED {name}: {len(data)} bytes sha256={actual_sha}')

      - name: Commit exact binaries and clean staging
        shell: bash
        run: |
          rm -rf .binary-staging/web-final
          rm -f .github/workflows/publish-web-final-office.yml
          git config user.name "FutolTech Submission QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "deliverables: publish final beautified Excel and English reviewer companion"
          git push
